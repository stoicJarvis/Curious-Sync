datastax-java-driver {
  basic.request.timeout = 10 seconds

  advanced.connection {
    # ScyllaDB is shard-per-core; more connections improve the odds of covering every shard
    # (the vanilla driver isn't shard-aware, so exact 1:1 coverage isn't guaranteed - see docs/ScyllaDB.md)
    pool.local.size = 8
    # raise the per-connection in-flight cap far above default (1024)
    max-requests-per-connection = 32768
  }

  advanced.throttler {
    # queue excess requests instead of failing fast when the pool is saturated
    class = ConcurrencyLimitingRequestThrottler
    max-concurrent-requests = 8192
    max-queue-size = 500000
  }
}
