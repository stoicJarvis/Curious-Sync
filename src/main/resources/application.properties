spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT}

# database configuration
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# for coloring the console output
spring.output.ansi.enabled=always

# redis configuration
spring.data.redis.host=${REDIS_CLOUD_PUBLIC_ENDPOINT}
spring.data.redis.port=${REDIS_CLOUD_PORT}
spring.data.redis.password=${REDIS_CLOUD_PASSWORD}

# kafka configuration
kafka.bootstrap-servers=localhost:9092

# kafka logging configuration
logging.level.org.apache.kafka=ERROR
logging.level.org.springframework.kafka=ERROR
logging.level.org.apache.kafka.clients.consumer.ConsumerConfig=ERROR
logging.level.org.apache.kafka.clients.producer.ProducerConfig=ERROR

# ── HikariCP connection pool ──────────────────────────────────────────────────
# Sized for 12 Kafka consumer threads + Spring service threads + headroom.
# Rule of thumb: (2 * num_consumer_threads) + spare = ~20-25 total.
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=10
# Fail fast (3s) if no connection available — prevents thread pile-ups
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── Hibernate JDBC batch inserts ──────────────────────────────────────────────
# Groups saveAll() calls into batches of 50 INSERTs per round-trip.
# Reduces N individual INSERT statements to ceil(N/50) round-trips.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true