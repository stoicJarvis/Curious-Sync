spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT}

# database configuration
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=false

# ScyllaDB configuration
spring.cassandra.contact-points=127.0.0.1
spring.cassandra.local-datacenter=datacenter1
spring.cassandra.keyspace-name=dev_sandbox
spring.cassandra.port=9042
spring.cassandra.schema-action=CREATE_IF_NOT_EXISTS
# advanced driver options (connection pool size, throttler, etc.) not exposed by spring.cassandra.* properties
spring.cassandra.config=classpath:cassandra-driver.conf

# for coloring the console output
spring.output.ansi.enabled=always

# redis configuration
spring.data.redis.host=${REDIS_CLOUD_PUBLIC_ENDPOINT}
spring.data.redis.port=${REDIS_CLOUD_PORT}
spring.data.redis.password=${REDIS_CLOUD_PASSWORD}

kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}

# 1. Batch size per thread (20,000 records = ~2.4 MB of raw payload)
kafka.consumer.max-poll-records=20000

# 2. Lower fetch threshold to ~1 MB (~8,500 events). Kafka won't block waiting for 10 MB.
kafka.consumer.fetch-min-bytes=1048576

# 3. Reduce max wait time from 5000ms to 100ms. Eliminates artificial polling delays.
kafka.consumer.fetch-max-wait-ms=100

# 4. Max bytes per partition fetch (10 MB is plenty for 20,000 records)
kafka.consumer.max-partition-fetch-bytes=10485760

# 5. Total max bytes across all partitions for a single consumer poll (50 MB)
kafka.consumer.fetch-max-bytes=52428800

# 6. Safety window for processing a 20,000-record batch (10 mins)
kafka.consumer.max-poll-interval-ms=600000

# 7. 12 parallel worker threads
kafka.consumer.concurrency=12

# 8. Fast-fail backoff
kafka.consumer.retry.backoff-ms=500
kafka.consumer.retry.max-attempts=3

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# kafka logging configuration
logging.level.org.apache.kafka=ERROR
logging.level.org.springframework.kafka=ERROR
logging.level.org.apache.kafka.clients.consumer.ConsumerConfig=ERROR
logging.level.org.apache.kafka.clients.producer.ProducerConfig=ERROR

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=40

spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true